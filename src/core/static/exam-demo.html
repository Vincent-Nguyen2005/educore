<!doctype html>
<html lang="vi"><meta charset="utf-8"><title>EduCore exam demo</title>
<style>body{font:16px system-ui;max-width:650px;margin:3rem auto;padding:1rem}input,textarea,select,button{display:block;width:100%;box-sizing:border-box;margin:.8rem 0;padding:.7rem}textarea{min-height:9rem}#status{font-weight:bold}</style>
<h1>EduCore — demo thi</h1>
<p>Demo local: dữ liệu nháp lưu IndexedDB trên thiết bị trước khi gửi. Chọn tenant, điền mã sinh viên và câu trả lời. API key demo không dùng trong production.</p>
<label>Trường<select id="tenant"><option value="a">Tenant A</option><option value="b">Tenant B</option></select></label>
<label>Mã sinh viên<input id="student" value="student-1"></label>
<label>Câu trả lời<textarea id="answer" placeholder="Nhập câu trả lời"></textarea></label>
<button id="submit">Nộp bài</button><p id="status">Sẵn sàng</p>
<script>
const $ = id => document.getElementById(id);
let db;
const open = indexedDB.open('educore-demo', 1);
open.onupgradeneeded = () => open.result.createObjectStore('drafts');
open.onsuccess = () => { db = open.result; restore(); setInterval(sync, 5000); };
open.onerror = () => $('status').textContent = 'Không mở được IndexedDB; không thể đảm bảo lưu nháp.';
function key() { return `${$('tenant').value}:${$('student').value}:final`; }
function get(k) { return new Promise((resolve,reject) => { const t=db.transaction('drafts'); const r=t.objectStore('drafts').get(k); r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error); }); }
function put(k,v) { return new Promise((resolve,reject) => { const t=db.transaction('drafts','readwrite'); t.objectStore('drafts').put(v,k); t.oncomplete=resolve; t.onerror=()=>reject(t.error); }); }
async function restore() { if (!db) return; const d=await get(key()); $('answer').value=d?.answer||''; $('status').textContent=d?.submitted?'Đã nộp trên server':d?'Có nháp trên thiết bị':'Sẵn sàng'; }
async function save() {
  if (!db) return;
  try { const old=await get(key()); const d={answer:$('answer').value,sequence:(old?.sequence||0)+1,submitted:false,submitKey:null}; await put(key(),d); $('status').textContent='Đã lưu nháp trên thiết bị; đang chờ đồng bộ'; }
  catch(e) { $('status').textContent='Lỗi lưu thiết bị: '+e.message; }
}
let timer;
$('answer').oninput=()=>{ clearTimeout(timer); timer=setTimeout(save,250); };
$('tenant').onchange=restore; $('student').onchange=restore;
async function send(path,body) { const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Demo-Key':`demo-key-${$('tenant').value}`},body:JSON.stringify(body)}); if (!r.ok) throw Error(`HTTP ${r.status}`); return r.json(); }
async function sync() {
  if (!db) return;
  const k=key(), d=await get(k); if (!d) return;
  const common={student_id:$('student').value,exam_id:'final',sequence:d.sequence,answers:{q1:d.answer}};
  try {
    await send('/autosaves',common);
    if (d.submitKey && !d.submitted) { await send('/submissions',{...common,idempotency_key:d.submitKey}); d.submitted=true; await put(k,d); }
    $('status').textContent=d.submitted?'Đã nộp trên server':'Nháp đã đồng bộ lên server';
  } catch(e) { $('status').textContent='Mất kết nối; nháp vẫn ở thiết bị, sẽ thử lại: '+e.message; }
}
$('submit').onclick=async()=>{ clearTimeout(timer); await save(); const k=key(),d=await get(k); if (!d) return; d.submitKey ||= crypto.randomUUID(); await put(k,d); await sync(); };
window.addEventListener('online',sync);
</script></html>
